[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analyzer"
version = "0.1.0"
description = "Command-line stock analysis: price history, technical indicators and comparisons"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
stock-analyzer = "stock_analyzer.cli:main"

[tool.setuptools]
packages = ["stock_analyzer"]
